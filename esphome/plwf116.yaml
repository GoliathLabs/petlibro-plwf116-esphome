# Petlibro PLWF116 water fountain (RTL8721DM / AmebaD) - full configuration.
# Pins: see NOTES.md, step 8. Pin numbers are GPIO numbers (PA_n = n, PB_n = 32 + n),
# because ESPHome does not know the board. Safety: PA_30 (pump) has a pull-up after reset,
# so the pump output is driven LOW at setup and again in on_boot. The "Pumpe" switch is the
# wish; the motor only runs once the scale has a valid reading and the tank is not empty.
substitutions:
  name: plwf116
  friendly_name: Petlibro PLWF116

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: 800
      then:
        - output.turn_off: pump_out
        - output.turn_off: pump_boost_out
    - priority: -100
      then:
        # Radar: config lines idle HIGH, power-cycle like the original Radar_init (200 ms off, then on).
        - output.turn_on: radar_cfg_a
        - output.turn_on: radar_cfg_b
        - output.turn_off: radar_power
        - delay: 200ms
        - output.turn_on: radar_power
        - script.execute: apply_pump
        - script.execute: update_leds

rtl87xx:
  board: petlibro-plwf116
  family: RTL8720D
  framework:
    # LibreTiny PR #403 + the PLWF116 patches in ../libretiny (branch plwf116)
    version: 1.14.0
    source: https://github.com/GoliathLabs/libretiny.git#plwf116

logger:
  baud_rate: 115200
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: PLWF116 Fallback
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption:

time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    # filter_days_left needs the time; without this it stays NAN for up to 1 h after boot
    on_time_sync:
      - component.update: filter_days_left

# White WiFi LED follows the connection state. Polled, because with on_connect /
# on_disconnect the LED was off while WiFi was connected (seen 04.11.2026).
interval:
  - interval: 5s
    then:
      - if:
          condition:
            wifi.connected:
          then:
            - if:
                condition:
                  light.is_off: led_wifi_white
                then:
                  - light.turn_on: led_wifi_white
          else:
            - if:
                condition:
                  light.is_on: led_wifi_white
                then:
                  - light.turn_off: led_wifi_white
  # Re-sync the status LEDs with the sensor states.
  - interval: 30s
    then:
      - script.execute: update_leds
      - script.execute: update_battery_leds

# Red WiFi LED blinks while WiFi/API are not connected (ESPHome status LED).
status_led:
  pin: 28  # PA_28

globals:
  - id: filter_changed_at
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: pump_running
    type: bool
    restore_value: false
    initial_value: "false"
  # Radar mode: true while the pump may run after a detection.
  - id: radar_hold
    type: bool
    restore_value: false
    initial_value: "false"

# --------------------------------------------------------------------------- pump
switch:
  # The user's wish; apply_pump decides whether the motor really runs.
  - platform: template
    id: pump
    name: Pumpe
    icon: mdi:pump
    optimistic: true
    restore_mode: ALWAYS_ON  # a fountain should run after every start
    on_turn_on:
      - script.execute: apply_pump
    on_turn_off:
      - script.execute: apply_pump

  - platform: template
    id: pump_boost
    name: Pumpe Boost
    icon: mdi:pump
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: apply_pump
    on_turn_off:
      - script.execute: apply_pump

  - platform: template
    id: dry_run_protection
    name: Trockenlaufschutz
    icon: mdi:water-alert
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - script.execute: apply_pump
    on_turn_off:
      - script.execute: apply_pump

select:
  # Dauerbetrieb: pump always runs. Radar: only for a while after a cat was detected.
  # Radar auf Akku: like the original firmware, radar mode on battery, continuous on mains.
  - platform: template
    id: pump_mode
    name: Pumpenmodus
    icon: mdi:radar
    optimistic: true
    restore_value: true
    options:
      - Dauerbetrieb
      - Radar
      - Radar auf Akku
    initial_option: Radar auf Akku
    on_value:
      - script.execute: apply_pump

# --------------------------------------------------------------------------- scale
number:
  - platform: template
    id: scale_zero
    name: Waage Nullpunkt (roh)
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: -16777216
    max_value: 16777216
    step: 1
    initial_value: 151497  # measured 04.11.2026: empty tank, cover on

  - platform: template
    id: scale_factor
    name: Waage Faktor (roh pro g)
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: -100000
    max_value: 100000
    step: 0.01
    initial_value: 290.3  # measured 04.11.2026: 1 l removed = 290 317 counts; fill line = 2549 g

  - platform: template
    id: water_low_g
    name: Schwelle Wasser niedrig
    entity_category: config
    unit_of_measurement: g
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 5000
    step: 10
    initial_value: 500

  - platform: template
    id: water_empty_g
    name: Schwelle Wasser leer
    entity_category: config
    unit_of_measurement: g
    mode: box
    optimistic: true
    restore_value: true
    min_value: 0
    max_value: 5000
    step: 10
    initial_value: 200

  - platform: template
    id: filter_days
    name: Filter Laufzeit
    entity_category: config
    unit_of_measurement: d
    icon: mdi:filter
    mode: box
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 120
    step: 1
    initial_value: 30
    on_value:
      - component.update: filter_days_left

  - platform: template
    id: radar_run_time
    name: Radar Nachlaufzeit
    icon: mdi:timer-outline
    entity_category: config
    unit_of_measurement: s
    mode: box
    optimistic: true
    restore_value: true
    min_value: 10
    max_value: 1800
    step: 10
    initial_value: 60  # original dev_attr holds 0x3C = 60

  - platform: template
    id: battery_divider
    name: Akku Spannungsteiler
    entity_category: config
    mode: box
    optimistic: true
    restore_value: true
    min_value: 1
    max_value: 5
    step: 0.001
    initial_value: 2.0
    on_value:
      - component.update: battery_voltage

sensor:
  # HX717 load cell ADC; protocol-compatible with the HX711 component.
  - platform: hx711
    id: scale_raw
    name: Waage roh
    entity_category: diagnostic
    clk_pin: 37   # PB_5
    dout_pin: 38  # PB_6
    gain: 128
    update_interval: 2s
    filters:
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: template
    id: water_weight
    name: Gewicht
    icon: mdi:scale
    unit_of_measurement: g
    device_class: weight
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 2s
    lambda: |-
      if (isnan(id(scale_raw).state) || id(scale_factor).state == 0)
        return NAN;
      return (id(scale_raw).state - id(scale_zero).state) / id(scale_factor).state;
    filters:
      - delta: 5

  # Battery voltage at the ADC pin (PB_2 = AD_5). The divider is assumed to be 1:2
  # (pin 2.08 V on a full battery; the original firmware reports 100 % at 4085 mV).
  - platform: template
    id: battery_adc
    name: Akku ADC-Spannung
    entity_category: diagnostic
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    update_interval: 30s
    lambda: return analogReadVoltage(34) / 1000.0f;
    on_value:
      - component.update: battery_voltage

  - platform: template
    id: battery_voltage
    name: Akku-Spannung
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      if (isnan(id(battery_adc).state)) return NAN;
      return id(battery_adc).state * id(battery_divider).state;
    on_value:
      - component.update: battery_level

  # Typical single-cell Li-ion curve under light load.
  - platform: template
    id: battery_level
    name: Akku
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v)) return NAN;
      static const float VOLT[] = {3.30f, 3.45f, 3.60f, 3.70f, 3.80f, 3.90f, 4.00f, 4.10f};
      static const float PCT[]  = {0.0f,  5.0f,  15.0f, 30.0f, 50.0f, 70.0f, 85.0f, 100.0f};
      if (v <= VOLT[0]) return 0.0f;
      for (int i = 1; i < 8; i++) {
        if (v <= VOLT[i])
          return PCT[i - 1] + (v - VOLT[i - 1]) / (VOLT[i] - VOLT[i - 1]) * (PCT[i] - PCT[i - 1]);
      }
      return 100.0f;
    on_value:
      - script.execute: update_battery_leds

  - platform: template
    id: filter_days_left
    name: Filter Resttage
    icon: mdi:filter-check
    unit_of_measurement: d
    accuracy_decimals: 0
    update_interval: 1h
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid() || id(filter_changed_at) == 0)
        return NAN;
      float used = (now.timestamp - (int64_t) id(filter_changed_at)) / 86400.0f;
      return id(filter_days).state - used;

  - platform: wifi_signal
    name: WLAN-Signal
    update_interval: 60s

  - platform: uptime
    name: Laufzeit

binary_sensor:
  # Reset button, active-low with an external pull-up.
  # Short press: pump on/off. Hold 3 s: filter changed.
  # Clicks in the first 10 s after boot are ignored: the pin reads "pressed" briefly at start-up,
  # which toggled the pump on every boot (seen 04.11.2026).
  - platform: gpio
    id: front_button
    name: Taste
    pin:
      number: 15  # PA_15
      inverted: true
      mode: INPUT
    filters:
      - delayed_on: 30ms
    on_state:
      - logger.log:
          format: "Taste %s (uptime %u ms)"
          args: ['x ? "gedrückt" : "losgelassen"', 'millis()']
    on_click:
      - min_length: 30ms
        max_length: 1s
        then:
          - if:
              condition:
                lambda: return millis() > 10000;
              then:
                - switch.toggle: pump
              else:
                - logger.log: "Klick beim Start ignoriert"
      - min_length: 3s
        max_length: 10s
        then:
          - if:
              condition:
                lambda: return millis() > 10000;
              then:
                - button.press: filter_changed

  # Radar detection output of both sensors (left/right), LOW = detected (original firmware).
  - platform: gpio
    id: radar
    name: Katze erkannt
    device_class: occupancy
    pin:
      number: 14  # PA_14
      inverted: true
      mode: INPUT
    filters:
      - delayed_off: 10s  # bridges short gaps while a cat moves
    on_press:
      - script.execute: radar_detected

  # Power supply detect, LOW while the adapter is plugged in (confirmed by unplugging).
  - platform: gpio
    id: mains
    name: Netzteil
    device_class: plug
    trigger_on_initial_state: true
    pin:
      number: 13  # PA_13
      inverted: true
      mode: INPUT
    on_state:
      - script.execute: update_battery_leds
      - script.execute: apply_pump

  # Charger CHRG output, LOW while charging (HIGH when full or on battery).
  - platform: gpio
    id: charging
    name: Lädt
    device_class: battery_charging
    trigger_on_initial_state: true
    pin:
      number: 12  # PA_12
      inverted: true
      mode: INPUT
    filters:
      - delayed_on_off: 2s
    on_state:
      - script.execute: update_battery_leds

  - platform: template
    id: water_low
    name: Wasser niedrig
    device_class: problem
    trigger_on_initial_state: true
    lambda: |-
      if (isnan(id(water_weight).state)) return {};
      return id(water_weight).state < id(water_low_g).state;
    filters:
      - delayed_on_off: 5s
    on_state:
      - script.execute: update_leds

  - platform: template
    id: water_empty
    name: Wasser leer
    device_class: problem
    trigger_on_initial_state: true
    lambda: |-
      if (isnan(id(water_weight).state)) return {};
      return id(water_weight).state < id(water_empty_g).state;
    filters:
      - delayed_on_off: 5s
    on_state:
      - script.execute: apply_pump
      - script.execute: update_leds

  - platform: template
    id: pump_running_sensor
    name: Pumpe läuft
    device_class: running
    lambda: return id(pump_running);

  - platform: template
    id: filter_due
    name: Filter fällig
    device_class: problem
    trigger_on_initial_state: true
    lambda: |-
      if (isnan(id(filter_days_left).state)) return {};
      return id(filter_days_left).state <= 0;
    on_state:
      - script.execute: update_leds

button:
  - platform: template
    id: filter_changed
    name: Filter gewechselt
    icon: mdi:filter-check
    on_press:
      - lambda: |-
          auto now = id(sntp_time).now();
          if (now.is_valid())
            id(filter_changed_at) = now.timestamp;
      - component.update: filter_days_left

  - platform: restart
    name: Neustart

# --------------------------------------------------------------------------- LEDs (all active-high)
output:
  - platform: gpio
    id: pump_out
    pin: 30  # PA_30, HIGH = pump on
  - platform: gpio
    id: pump_boost_out
    pin: 36  # PB_4, HIGH = boost (original firmware uses it only together with the pump)
  - platform: gpio
    id: radar_power
    pin:
      number: 16  # PA_16, LOW = radar powered
      inverted: true
  - platform: gpio
    id: radar_cfg_a
    pin: 19  # PA_19, one-wire config line (gain/threshold), idle HIGH
  - platform: gpio
    id: radar_cfg_b
    pin: 33  # PB_1, one-wire config line of the other side, idle HIGH
  - platform: gpio
    id: out_led_wifi_white
    pin: 26  # PA_26
  - platform: gpio
    id: out_led_water_red
    pin: 25  # PA_25
  - platform: gpio
    id: out_led_water_yellow
    pin: 35  # PB_3 (also SWD_CLK; LibreTiny turns SWD off)
  - platform: gpio
    id: out_led_filter_red
    pin: 39  # PB_7
  - platform: gpio
    id: out_led_battery_white
    pin: 55  # PB_23
  - platform: gpio
    id: out_led_battery_red
    pin: 58  # PB_26

# All LEDs are driven by the firmware only (internal). The warning LEDs were on
# without a warning, most likely switched from Home Assistant (seen 04.11.2026).
light:
  - platform: binary
    id: led_wifi_white
    name: LED WLAN
    internal: true
    output: out_led_wifi_white
    restore_mode: ALWAYS_OFF
  - platform: binary
    id: led_water_red
    name: LED Wasser rot
    internal: true
    output: out_led_water_red
    restore_mode: ALWAYS_OFF
  - platform: binary
    id: led_water_yellow
    name: LED Wasser gelb
    internal: true
    output: out_led_water_yellow
    restore_mode: ALWAYS_OFF
  - platform: binary
    id: led_filter_red
    name: LED Filter
    internal: true
    output: out_led_filter_red
    restore_mode: ALWAYS_OFF
  - platform: binary
    id: led_battery_white
    name: LED Akku weiß
    internal: true
    output: out_led_battery_white
    restore_mode: ALWAYS_OFF
  - platform: binary
    id: led_battery_red
    name: LED Akku rot
    internal: true
    output: out_led_battery_red
    restore_mode: ALWAYS_OFF

script:
  # A detection lets the pump run for the configured time; a new detection restarts the timer.
  - id: radar_detected
    mode: restart
    then:
      - lambda: id(radar_hold) = true;
      - script.execute: apply_pump
      - delay: !lambda return id(radar_run_time).state * 1000;
      - wait_until:
          binary_sensor.is_off: radar
      - lambda: id(radar_hold) = false;
      - script.execute: apply_pump

  # Battery LEDs: white while charging, red when running on battery below 20 %.
  - id: update_battery_leds
    mode: restart
    then:
      - lambda: |-
          bool on_mains = id(mains).has_state() && id(mains).state;
          bool is_charging = on_mains && id(charging).has_state() && id(charging).state;
          float pct = id(battery_level).state;
          bool low = !on_mains && !isnan(pct) && pct < 20.0f;
          auto white = is_charging ? id(led_battery_white)->turn_on() : id(led_battery_white)->turn_off();
          white.perform();
          auto red = low ? id(led_battery_red)->turn_on() : id(led_battery_red)->turn_off();
          red.perform();

  # Motor on only if wanted, and (dry-run protection off, or scale valid and tank not empty).
  - id: apply_pump
    mode: queued
    then:
      - lambda: |-
          bool valid = id(water_empty).has_state();
          bool empty = valid && id(water_empty).state;
          bool on_mains = id(mains).has_state() && id(mains).state;
          auto mode = id(pump_mode).current_option();
          bool radar_mode = mode == "Radar" || (mode == "Radar auf Akku" && !on_mains);
          bool run = id(pump).state && (!id(dry_run_protection).state || (valid && !empty)) &&
                     (!radar_mode || id(radar_hold));
          if (run != id(pump_running))
            ESP_LOGI("pump", "Motor %s (Wunsch %s, Waage %s, leer %s, Radarmodus %s)", run ? "an" : "aus",
                     id(pump).state ? "an" : "aus", valid ? "ok" : "noch kein Wert", empty ? "ja" : "nein",
                     radar_mode ? "ja" : "nein");
          if (run) id(pump_out).turn_on(); else id(pump_out).turn_off();
          if (run && id(pump_boost).state) id(pump_boost_out).turn_on(); else id(pump_boost_out).turn_off();
          id(pump_running) = run;

  # Water LEDs: red = empty, yellow = low. Filter LED = filter due.
  - id: update_leds
    mode: restart
    then:
      - lambda: |-
          bool empty = id(water_empty).has_state() && id(water_empty).state;
          bool low = id(water_low).has_state() && id(water_low).state;
          bool filter = id(filter_due).has_state() && id(filter_due).state;
          auto set = [](light::LightState *l, bool on) {
            auto call = on ? l->turn_on() : l->turn_off();
            call.perform();
          };
          set(id(led_water_red), empty);
          set(id(led_water_yellow), low && !empty);
          set(id(led_filter_red), filter);

text_sensor:
  - platform: version
    name: ESPHome-Version
  # OTA slot the bootloader started (1 = OTA1 @0x6000, 2 = OTA2 @0x186000).
  - platform: template
    name: Firmware-Slot
    entity_category: diagnostic
    update_interval: 60s
    lambda: return std::string("OTA") + to_string(lt_ota_dual_get_current());
    on_value:
      - logger.log:
          format: "Firmware-Slot: %s"
          args: [x.c_str()]
  - platform: wifi_info
    ip_address:
      name: IP-Adresse
