# Copy to secrets.yaml and fill in.
wifi_ssid: "your-ssid"
wifi_password: "your-wifi-password"
ap_password: "fallback-ap-password"
# Must be valid base64 of 32 bytes (placeholders fail validation): openssl rand -base64 32
# Also used as OTA encryption key (ESPHome requires one key per device).
api_key: "base64-32-byte-key"
